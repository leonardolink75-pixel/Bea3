<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEA Beachwear · Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--sand:#EAD9C1;--olive:#55633A;--pool:#7CA7A1;--gold:#C9A96B;--bg:#F4EAD8;--card:#FBF5EA;--ink:#3a4528;--mut:#7d7a68;--line:#e0cfb3;--btn:#55633A;--btnt:#F4EAD8;--gtxt:#9a7a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#222918;--card:#2d371f;--ink:#EAD9C1;--mut:#aaa690;--line:#454f33;--btn:#C9A96B;--btnt:#222918;--gtxt:#C9A96B}}
:root[data-theme="dark"]{--bg:#222918;--card:#2d371f;--ink:#EAD9C1;--mut:#aaa690;--line:#454f33;--btn:#C9A96B;--btnt:#222918;--gtxt:#C9A96B}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Montserrat,system-ui,sans-serif;min-height:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{text-align:center;padding:22px 0 6px}
.bea{font:700 54px/1 'Playfair Display',Georgia,serif;color:var(--ink);letter-spacing:-1px;margin-top:-6px}
.sub{letter-spacing:.5em;font-size:11px;color:var(--ink);margin-top:4px;padding-left:.5em}
.lema{font-size:11px;letter-spacing:.2em;color:var(--mut);margin-top:10px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:1px solid var(--line);color:var(--ink);padding:7px 2px;border-radius:16px;font:500 11px Montserrat,sans-serif;cursor:pointer;min-width:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rep{background:var(--bg);border:1px dashed var(--gold);border-radius:14px;padding:12px;margin-top:10px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.mnav h2{margin:0;text-transform:capitalize}
.mnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--ink);font-size:18px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;text-align:right;border-top:1px dashed var(--line)}th:first-child,td:first-child{text-align:left;text-transform:capitalize}th{color:var(--mut);font-weight:500;border-top:0}
.bk{display:flex;gap:10px}.bk .btn{margin-top:10px}
nav button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
h2{font:500 22px 'Playfair Display',serif;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{border-radius:18px;padding:14px;background:var(--card);border:1px solid var(--line)}
.m small{color:var(--mut);display:block}
.m b{font:700 24px 'Playfair Display',serif;display:block;margin-top:2px}
.m.olive{background:var(--olive);color:#F4EAD8;border-color:var(--olive)}.m.olive small{color:#d6d0b4}
.m.pool{background:var(--pool);color:#1f2d2b;border-color:var(--pool)}.m.pool small{color:#2b4642}
.m.gold{background:var(--gold);color:#2d2610;border-color:var(--gold)}.m.gold small{color:#4d4020}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:400 15px Montserrat,sans-serif}
input:focus,button:focus-visible{outline:2px solid var(--pool);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:999px;background:var(--btn);color:var(--btnt);font:600 14px Montserrat,sans-serif;cursor:pointer}
.btn.gold{background:var(--gold);color:#2d2610}
.link{background:none;border:0;color:var(--mut);font:12px Montserrat,sans-serif;text-decoration:underline;cursor:pointer;padding:4px}
.var{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px dashed var(--line)}
.var.zero{opacity:.45}
.step{display:flex;align-items:center;gap:8px}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--ink);font-size:18px;cursor:pointer}
.step span{min-width:18px;text-align:center;font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ph h3{margin:0;font:700 18px 'Playfair Display',serif}
.tag{font-size:12px;color:var(--gtxt)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.cells div{display:flex;flex-direction:column;gap:3px;font-size:12px}
.cells input{padding:8px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.sale{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:13px}
.sale:first-of-type{border-top:0}
.sum{margin-top:10px;font-size:13px;color:var(--mut)}.sum b{color:var(--ink)}
.toast{z-index:30;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--olive);color:#F4EAD8;padding:11px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
header{position:relative}.hbk{position:absolute;top:14px;right:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.hbk .ico{width:17px;height:17px}
.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#2d2610;box-shadow:0 6px 16px rgba(60,50,20,.3);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:6}.fab.on{display:flex}
.sheet{position:fixed;inset:0;background:rgba(30,35,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet.on{display:flex}
.panel{position:relative;width:min(100%,640px);max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}.panel h2{margin:6px 0 10px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);font-size:14px;cursor:pointer;z-index:1}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes down{to{transform:translateY(100%)}}@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}
.sheet.on{animation:fi .25s ease-out}.sheet.on .panel{animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:fo .22s ease-in forwards}.sheet.out .panel{animation:down .22s ease-in forwards}
@media (prefers-reduced-motion:reduce){.sheet.on,.sheet.on .panel,.sheet.out,.sheet.out .panel{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:500 13px Montserrat,sans-serif;cursor:pointer}.chip.on{background:var(--pool);color:#1f2d2b;border-color:var(--pool)}
.bar{margin-bottom:12px;cursor:pointer}.bar:last-child{margin-bottom:0}.bl{display:flex;justify-content:space-between;font-size:13px}.bt{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:4px 0 2px}.bt div{height:100%;border-radius:99px}.bar small{color:var(--mut);font-size:11px}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:12px}.pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--btn);transition:transform .38s cubic-bezier(.3,.8,.3,1)}.seg button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--ink);padding:9px;border-radius:999px;font:500 13px Montserrat,sans-serif;cursor:pointer;transition:color .3s}.seg button.on{color:var(--btnt)}
.bt div{transition:width .55s cubic-bezier(.3,.8,.3,1)}.swap{animation:fi .45s ease-out}
@media (prefers-reduced-motion:reduce){.pill,.bt div,.seg button{transition:none}.swap{animation:none}}
.waves{display:block;width:100%;height:54px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<header>
<button class="hbk" onclick="go('backup')" aria-label="Backup" title="Backup"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button>
<svg id="sun" width="110" height="58" viewBox="0 0 110 58" fill="none" stroke="#C9A96B" stroke-width="2" stroke-linecap="round" aria-hidden="true"></svg>
<div class="bea">BEA</div>
<div class="sub">BEACHWEAR</div>
<div class="lema">sol · corpo · liberdade · você</div>
<svg class="waves" viewBox="0 0 400 54" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C60 6 120 6 200 26 S340 40 400 18 V54 H0Z" fill="#7CA7A1"/><path d="M0 40 C80 20 150 22 230 38 S350 50 400 34 V54 H0Z" fill="#55633A"/><path d="M0 34 C70 14 140 16 220 32 S350 44 400 26" fill="none" stroke="#C9A96B" stroke-width="1.5"/></svg>
</header>
<nav id="nav">
<button data-t="resumo" class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
<button data-t="estoque"><svg class="ico" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v9l-9 5-9-5zM3 8l9 5 9-5M12 13v9"/></svg>Estoque</button>
<button data-t="vendas"><svg class="ico" viewBox="0 0 24 24"><path d="M6 7h14l-1.5 9h-11zM6 7L5 3H2M9 20.5h.01M17 20.5h.01"/></svg>Vendas</button>
<button data-t="mensal"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>Mensal</button>
</nav>
<main id="main"></main>
</div>
<button class="fab" id="fab" onclick="openNovo()" aria-label="Novo produto" title="Novo produto"><svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2.2"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeNovo()"><div class="panel" role="dialog" aria-label="Novo produto"><button class="x" onclick="closeNovo()" aria-label="Fechar">✕</button><div id="sheetc"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='bea_gestao_v1';
let db={products:[],sales:[]},tab='resumo',sel={},disc={},draft={name:'',colors:'',sizes:'',buy:'',sell:'',q:{}};
let rp=null,rq={},rn={c:'',s:'',p:'',q:{}},pf='',per='tudo',mon=new Date().toISOString().slice(0,7);
try{const s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
function norm(){db.products=db.products||[];db.sales=db.sales||[];
 if(!db.buys){db.buys=db.products.filter(p=>p.bought).map(p=>({id:p.id,pid:p.id,name:p.name,qty:p.bought,cost:p.buy*p.bought}))}}
norm();
const mk=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const R=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=v=>[...new Set(String(v).split(',').map(x=>x.trim()).filter(Boolean))];
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
// sol
(()=>{let s='<path d="M37 52a18 18 0 0 1 36 0"/>';for(let a=190;a<=350;a+=20){const r=a*Math.PI/180,c=Math.cos(r),n=Math.sin(r);s+=`<line x1="${55+c*26}" y1="${52+n*26}" x2="${55+c*(a%40==10?44:38)}" y2="${52+n*(a%40==10?44:38)}"/>`}$('sun').innerHTML=s})();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
function render(){$('fab').classList.toggle('on',tab==='resumo'||tab==='estoque');$('main').innerHTML=tab==='resumo'?vResumo():tab==='estoque'?vEstoque():tab==='vendas'?vVendas():tab==='mensal'?vMensal():tab==='backup'?vBackup():vNovo()}
function go(t){tab=t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));render()}

function vResumo(){
 let itens=0,gasto=0,estCusto=0,estVenda=0;
 db.products.forEach(p=>{const q=p.v.reduce((a,x)=>a+x.q,0);itens+=q;estCusto+=q*p.buy;estVenda+=q*p.sell});
 const inP=x=>per==='tudo'||mk(x.id)===mk(Date.now()),S=db.sales.filter(inP),B=db.buys.filter(inP);
 gasto=B.reduce((a,b)=>a+b.cost,0);
 const fat=S.reduce((a,s)=>a+s.rev,0),custo=S.reduce((a,s)=>a+s.cost,0),lucro=fat-custo,mg=fat?lucro/fat*100:0,qv=S.reduce((a,s)=>a+s.qty,0);
 const keys=[...PAYS,'Sem informação'],col={'Pix':'#7CA7A1','Dinheiro':'#C9A96B','Cartão débito':'#55633A','Cartão crédito':'#B58E6A','Sem informação':'#c9bfa9'};
 const isP=(x,k)=>k==='Sem informação'?!x.pay:x.pay===k;
 const bp=keys.map(k=>{const l=S.filter(x=>isP(x,k));return{k,n:l.length,v:l.reduce((a,x)=>a+x.rev,0)}}).filter(x=>x.n||PAYS.includes(x.k));
 const fs=S.filter(x=>!pf||isP(x,pf)),fsum=fs.reduce((a,x)=>a+x.rev,0);
 const bars=fat?bp.map(({k,n,v})=>{const pc=Math.round(v/fat*100);return `<div class="bar" onclick="setPf('${k}')"><div class="bl"><span>${k}</span><b data-id="bv${keys.indexOf(k)}" data-k="r" data-v="${v}">${R(v)}</b></div><div class="bt"><div data-id="bw${keys.indexOf(k)}" data-w="${v?Math.max(pc,2):0}" style="width:${v?Math.max(pc,2):0}%;background:${col[k]}"></div></div><small>${n} venda(s) · ${pc}%</small></div>`}).join(''):'<div class="empty">O gráfico aparece depois da primeira venda.</div>';
 const chips=`<div class="chips" style="margin-bottom:6px"><button class="chip ${pf?'':'on'}" onclick="setPf('')">Todas</button>${bp.map(x=>`<button class="chip ${pf===x.k?'on':''}" onclick="setPf('${x.k}')">${x.k}</button>`).join('')}</div>${pf?`<div class="sum" style="margin:0 0 4px">${fs.length} venda(s) · faturamento <b>${R(fsum)}</b></div>`:''}`;
 const last=fs.slice().reverse().slice(0,8).map(s=>`<div class="sale"><div><b>${esc(s.name)}</b><br><small style="color:var(--mut)">${esc(s.items)}${s.disc?' · desconto '+R(s.disc):''}<br>${s.date}${s.pay?' · '+esc(s.pay):''}</small></div><div style="text-align:right">${R(s.rev)}<br><button class="link" onclick="undo(${s.id})">Desfazer</button></div></div>`).join('');
 return `<h2>Resumo</h2><div class="seg" id="seg"><span class="pill" style="transform:translateX(${per==='mes'?'100%':'0'})"></span><button class="${per==='tudo'?'on':''}" onclick="setPer('tudo')">Tudo</button><button class="${per==='mes'?'on':''}" onclick="setPer('mes')">Este mês</button></div>${per==='mes'?`<div class="sum" style="margin:-4px 0 10px;text-transform:capitalize">${mname(mk(Date.now()))}</div>`:''}<div class="grid">
 <div class="m olive"><small>Itens em estoque agora</small><b>${itens}</b></div>
 <div class="m pool"><small>Valor gasto em compras</small><b data-id="gasto" data-k="r" data-v="${gasto}">${R(gasto)}</b></div>
 <div class="m gold"><small>Faturamento (<span data-id="qv" data-k="i" data-v="${qv}">${qv}</span> vendidos)</small><b data-id="fat" data-k="r" data-v="${fat}">${R(fat)}</b></div>
 <div class="m"><small>Lucro · margem <span data-id="mg" data-k="p" data-v="${mg}">${mg.toFixed(1).replace('.',',')}%</span></small><b data-id="lucro" data-k="r" data-v="${lucro}" style="color:${lucro<0?'#b5473a':'var(--gtxt)'}">${R(lucro)}</b></div></div>
 <div class="card" style="margin-top:12px"><div class="sum">Estoque atual a preço de compra: <b>${R(estCusto)}</b><br>Estoque atual a preço de revenda: <b>${R(estVenda)}</b><br>Lucro previsto se vender tudo: <b>${R(estVenda-estCusto)}</b></div></div>
 <h2>Formas de pagamento</h2><div class="card">${bars}</div>
 <h2>Últimas vendas</h2><div class="card" id="lastcard">${chips}${last||`<div class="empty">${S.length?'Nenhuma venda nessa forma de pagamento.':per==='mes'?'Nenhuma venda neste mês.':'Nenhuma venda ainda. Registre vendas na aba Vendas.'}</div>`}</div>`}

function vEstoque(){
 if(!db.products.length)return `<h2>Estoque</h2><div class="card empty">Seu estoque está vazio.<br>Toque no + para cadastrar o primeiro produto.</div>`;
 return `<h2>Estoque</h2>`+db.products.map(p=>{
  const tq=p.v.reduce((a,x)=>a+x.q,0);
  return `<div class="card"><div class="ph"><div><h3>${esc(p.name)}</h3><div class="tag">${tq} em estoque · compra ${R(p.buy)} · revenda ${R(p.sell)} · lucro ${R(p.sell-p.buy)}/un</div></div><button class="link" onclick="delP(${p.id})">Excluir</button></div>
  ${p.v.map(x=>`<div class="var ${x.q?'':'zero'}"><div>${esc(x.c)} · <b>${esc(x.s)}</b></div><div><b>${x.q}</b> disponível</div></div>`).join('')}
  <button class="link" onclick="togRep(${p.id})">${rp===p.id?'Fechar reposição':'+ Repor estoque'}</button>
  ${rp===p.id?`<div class="rep"><b>Repor peças</b>
  <label>Cores (separe por vírgula)</label><input value="${esc(rn.c)}" placeholder="Verde oliva, Areia" oninput="rn.c=this.value;rgrade()">
  <label>Tamanhos (separe por vírgula)</label><input value="${esc(rn.s)}" placeholder="P, M, G" oninput="rn.s=this.value;rgrade()">
  <label>Quantidade que chegou de cada cor e tamanho</label><div class="cells" id="rgrade"></div>
  <label>Preço de compra desta reposição (R$ por peça)</label><input inputmode="decimal" placeholder="${String(p.buy).replace('.',',')}" value="${esc(rn.p)}" oninput="rn.p=this.value">
  <button class="btn" onclick="repor(${p.id})">Salvar reposição</button></div>`:''}
  </div>`}).join('')}

const PAYS=['Pix','Dinheiro','Cartão débito','Cartão crédito'];let pay={};
function tween(e,a,b){const kind=e.dataset.k,t0=performance.now(),D=450,f=v=>kind==='r'?R(v):kind==='p'?v.toFixed(1).replace('.',',')+'%':Math.round(v)+'';
 (function step(t){const p=Math.min(1,(t-t0)/D),k=1-Math.pow(1-p,3);if(p<1){e.textContent=f(a+(b-a)*k);requestAnimationFrame(step)}else e.textContent=f(b)})(t0)}
function setPer(p){if(p===per)return;const old=per,prev={};
 document.querySelectorAll('[data-id]').forEach(e=>prev[e.dataset.id]=e.dataset.w!==undefined?+e.dataset.w:+e.dataset.v);
 per=p;render();
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const seg=$('seg'),pill=seg.querySelector('.pill'),bs=seg.querySelectorAll('button'),set=v=>{pill.style.transform=v==='mes'?'translateX(100%)':'translateX(0)';bs.forEach((b,i)=>b.classList.toggle('on',(i===1)===(v==='mes')))};
 pill.style.transition='none';bs.forEach(b=>b.style.transition='none');set(old);seg.offsetWidth;
 pill.style.transition='';bs.forEach(b=>b.style.transition='');set(per);
 document.querySelectorAll('[data-id]').forEach(e=>{const id=e.dataset.id;
  if(e.dataset.w!==undefined){const to=+e.dataset.w;e.style.transition='none';e.style.width=(prev[id]??0)+'%';e.offsetWidth;e.style.transition='';e.style.width=to+'%';return}
  const to=+e.dataset.v,from=prev[id];if(from!==undefined&&from!==to)tween(e,from,to)});
 const lc=$('lastcard');if(lc)lc.classList.add('swap')}
function setPf(k){pf=pf===k?'':k;render()}
function setPay(id,m){pay[id]=m;render()}
function vVendas(){
 const ps=db.products.filter(p=>p.v.some(x=>x.q>0));
 if(!ps.length)return `<h2>Vendas</h2><div class="card empty">Nenhuma peça disponível para vender.<br>Cadastre ou reponha produtos na aba Estoque.</div>`;
 return `<h2>Nova venda</h2>`+ps.map(p=>{
  const s=sel[p.id]||{};let qty=0;p.v.forEach((x,i)=>qty+=s[i]||0);
  const gross=qty*p.sell,d=Math.min(num(disc[p.id]),gross),tot=gross-d,lucro=tot-qty*p.buy;
  return `<div class="card"><div class="ph"><div><h3>${esc(p.name)}</h3><div class="tag">${R(p.sell)} por peça</div></div></div>
  ${p.v.map((x,i)=>`<div class="var ${x.q?'':'zero'}"><div>${esc(x.c)} · <b>${esc(x.s)}</b><br><small style="color:var(--mut)">${x.q} disponível</small></div><div class="step"><button onclick="stp(${p.id},${i},-1)" aria-label="menos">−</button><span>${s[i]||0}</span><button onclick="stp(${p.id},${i},1)" aria-label="mais">+</button></div></div>`).join('')}
  <label for="d${p.id}">Desconto (R$), se houver</label><input id="d${p.id}" inputmode="decimal" placeholder="0,00" value="${disc[p.id]||''}" onchange="disc[${p.id}]=this.value;render()">
  <label>Forma de pagamento</label><div class="chips">${PAYS.map(m=>`<button class="chip ${pay[p.id]===m?'on':''}" onclick="setPay(${p.id},'${m}')">${m}</button>`).join('')}</div>
  <div class="sum">${qty} peça(s) · total <b>${R(tot)}</b> · lucro <b>${R(lucro)}</b></div>
  <button class="btn gold" ${qty?'':'disabled style="opacity:.45"'} onclick="sell(${p.id})">Confirmar venda</button></div>`}).join('')}

function stp(id,i,d){const p=db.products.find(x=>x.id===id);sel[id]=sel[id]||{};const n=(sel[id][i]||0)+d;sel[id][i]=Math.max(0,Math.min(p.v[i].q,n));render()}
function sell(id){const p=db.products.find(x=>x.id===id),s=sel[id]||{};let qty=0,its=[],picked=[];
 if(!Object.values(s).some(n=>n>0))return;if(!pay[id]){toast('Escolha a forma de pagamento');return}
 p.v.forEach((x,i)=>{const n=s[i]||0;if(n){qty+=n;x.q-=n;its.push(`${x.c}/${x.s} ×${n}`);picked.push([i,n])}});
 if(!qty)return;const gross=qty*p.sell,d=Math.min(num(disc[id]),gross);
 db.sales.push({id:Date.now(),pid:id,name:p.name,items:its.join(', '),picked,qty,disc:d,pay:pay[id],rev:gross-d,cost:qty*p.buy,date:new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})});
 sel[id]={};disc[id]='';pay[id]='';save();render();toast('Venda registrada')}
function undo(id){const s=db.sales.find(x=>x.id===id),p=db.products.find(x=>x.id===s.pid);if(p)s.picked.forEach(([i,n])=>p.v[i].q+=n);db.sales=db.sales.filter(x=>x!==s);save();render();toast('Venda desfeita')}
function delP(id){if(!confirm('Excluir este produto e o estoque dele? As vendas já feitas continuam no resumo.'))return;db.products=db.products.filter(p=>p.id!==id);save();render()}

function togRep(id){rp=rp===id?null:id;rn={c:'',s:'',p:'',q:{}};
 if(rp){const p=db.products.find(x=>x.id===id),u=k=>[...new Set(p.v.map(x=>x[k]))].join(', ');rn.c=u('c');rn.s=u('s')}
 render();rgrade()}
function rgrade(){const g=$('rgrade');if(!g)return;const cs=list(rn.c),ss=list(rn.s);
 g.innerHTML=cs.length&&ss.length?cs.flatMap(c=>ss.map(t=>`<div>${esc(c)} · ${esc(t)}<input inputmode="numeric" placeholder="0" data-k="${esc(c)}|${esc(t)}" value="${esc(rn.q[c+'|'+t]||'')}" oninput="rn.q[this.dataset.k]=this.value"></div>`)).join(''):'<span style="color:var(--mut);font-size:12px">Preencha cores e tamanhos para ver a grade.</span>'}
function repor(id){const p=db.products.find(x=>x.id===id),cs=list(rn.c),ss=list(rn.s),ch=[];let add=0;
 cs.forEach(c=>ss.forEach(t=>{const n=Math.max(0,parseInt(rn.q[c+'|'+t])||0);if(n){ch.push([c,t,n]);add+=n}}));
 if(!add){toast('Informe a quantidade que chegou');return}
 const price=rn.p.trim()?num(rn.p):p.buy,cost=add*price;
 ch.forEach(([c,t,n])=>{let x=p.v.find(v=>v.c.toLowerCase()===c.toLowerCase()&&v.s.toLowerCase()===t.toLowerCase());if(!x){x={c,s:t,q:0};p.v.push(x)}x.q+=n});
 p.buy=(p.buy*p.bought+cost)/(p.bought+add);p.bought+=add;
 db.buys.push({id:Date.now(),pid:id,name:p.name,qty:add,cost});
 rp=null;rn={c:'',s:'',p:'',q:{}};save();render();toast('Estoque reposto: +'+add+' peças')}

function mshift(d){const [y,m]=mon.split('-').map(Number),n=new Date(y,m-1+d,1);mon=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');render()}
const mname=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
function stats(m){const s=db.sales.filter(x=>mk(x.id)===m),b=db.buys.filter(x=>mk(x.id)===m),gasto=b.reduce((a,x)=>a+x.cost,0),fat=s.reduce((a,x)=>a+x.rev,0),lucro=fat-s.reduce((a,x)=>a+x.cost,0);return{gasto,fat,lucro,qv:s.reduce((a,x)=>a+x.qty,0),qc:b.reduce((a,x)=>a+x.qty,0),mg:fat?lucro/fat*100:0}}
function vMensal(){const t=stats(mon),meses=[...new Set([...db.sales,...db.buys].map(x=>mk(x.id)).concat(mon))].sort().reverse().slice(0,12);
 return `<div class="mnav"><button onclick="mshift(-1)" aria-label="Mês anterior">‹</button><h2>${mname(mon)}</h2><button onclick="mshift(1)" aria-label="Próximo mês">›</button></div>
 <div class="grid"><div class="m pool"><small>Gasto em compras (${t.qc} peças)</small><b>${R(t.gasto)}</b></div>
 <div class="m gold"><small>Faturamento (${t.qv} vendidas)</small><b>${R(t.fat)}</b></div>
 <div class="m olive"><small>Lucro</small><b>${R(t.lucro)}</b></div>
 <div class="m"><small>Margem de lucro</small><b>${t.mg.toFixed(1).replace('.',',')}%</b></div></div>
 <div class="card" style="margin-top:12px"><div class="sum">Faturamento menos gasto no mês: <b>${R(t.fat-t.gasto)}</b></div></div>
 <h2>Mês a mês</h2><div class="card" style="overflow-x:auto"><table><tr><th>Mês</th><th>Gasto</th><th>Faturou</th><th>Lucro</th></tr>${meses.map(m=>{const x=stats(m);return `<tr onclick="mon='${m}';render()" style="cursor:pointer"><td>${mname(m)}</td><td>${R(x.gasto)}</td><td>${R(x.fat)}</td><td>${R(x.lucro)}</td></tr>`}).join('')}</table></div>`}

function vBackup(){return `<h2>Backup</h2><div class="card"><p style="margin-top:0">Seus dados ficam só neste navegador. Baixe um backup em .json para guardar com segurança ou levar para outro aparelho.</p>
 <div class="sum">${db.products.length} produto(s) · ${db.sales.length} venda(s) · ${db.buys.length} compra(s)</div>
 <button class="btn" onclick="exportar()">Baixar backup (.json)</button>
 <label for="rf" style="margin-top:18px">Restaurar a partir de um arquivo de backup</label>
 <input id="rf" type="file" accept=".json,application/json" onchange="importar(this)">
 <p class="sum">Restaurar substitui todos os dados atuais pelos do arquivo.</p></div>`}
async function exportar(){let dl=null;try{dl=await claude.use('downloads')}catch(e){}
 if(!dl){toast('Download indisponível aqui. Abra o app pelo link do artefato.');return}
 const f='bea-backup-'+new Date().toISOString().slice(0,10)+'.json';
 try{await dl.save({filename:f,data:JSON.stringify({app:'bea-gestao',v:1,exportado:new Date().toISOString(),db},null,2)});toast('Backup salvo')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível salvar o backup')}}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result),d=j.db||j;if(!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0;
  if(!confirm('Substituir os dados atuais por este backup ('+d.products.length+' produtos, '+d.sales.length+' vendas)?')){inp.value='';return}
  db=d;norm();sel={};disc={};rp=null;save();render();toast('Backup restaurado')}catch(e){toast('Arquivo inválido');inp.value=''}};
 r.readAsText(f)}

function openNovo(){$('sheetc').innerHTML=vNovo();$('sheet').classList.add('on');grade()}
function closeNovo(){const e=$('sheet');if(!e.classList.contains('on')||e.classList.contains('out'))return;e.classList.add('out');setTimeout(()=>e.classList.remove('on','out'),220)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNovo()});
function vNovo(){const d=draft;return `<h2>Novo produto</h2><div class="card">
 <label for="n">Nome</label><input id="n" value="${esc(d.name)}" placeholder="Ex.: Biquíni Cortininha" oninput="draft.name=this.value">
 <label for="c">Cores (separe por vírgula)</label><input id="c" value="${esc(d.colors)}" placeholder="Verde oliva, Areia" oninput="draft.colors=this.value;grade()">
 <label for="s">Tamanhos (separe por vírgula)</label><input id="s" value="${esc(d.sizes)}" placeholder="P, M, G" oninput="draft.sizes=this.value;grade()">
 <div class="row"><div><label for="b">Preço de compra (R$)</label><input id="b" inputmode="decimal" value="${esc(d.buy)}" oninput="draft.buy=this.value"></div><div><label for="r">Preço de revenda (R$)</label><input id="r" inputmode="decimal" value="${esc(d.sell)}" oninput="draft.sell=this.value"></div></div>
 <label>Quantidade de cada cor e tamanho</label><div class="cells" id="grade"></div>
 <button class="btn" onclick="addP()">Salvar produto</button></div>`}
function grade(){const g=$('grade');if(!g)return;const cs=list(draft.colors),ss=list(draft.sizes);
 g.innerHTML=cs.length&&ss.length?cs.flatMap(c=>ss.map(s=>`<div>${esc(c)} · ${esc(s)}<input inputmode="numeric" value="${draft.q[c+'|'+s]||''}" placeholder="0" oninput="draft.q['${c.replace(/'/g,"\\'")}|${s.replace(/'/g,"\\'")}']=this.value"></div>`)).join(''):'<span style="color:var(--mut);font-size:12px">Preencha cores e tamanhos para ver a grade.</span>'}
function addP(){const cs=list(draft.colors),ss=list(draft.sizes),buy=num(draft.buy),sell=num(draft.sell);
 if(!draft.name.trim()||!cs.length||!ss.length||!sell){toast('Preencha nome, cores, tamanhos e preço de revenda');return}
 const v=cs.flatMap(c=>ss.map(s=>({c,s,q:Math.max(0,parseInt(draft.q[c+'|'+s])||0)})));
 const id=Date.now(),bought=v.reduce((a,x)=>a+x.q,0);
 db.products.push({id,name:draft.name.trim(),buy,sell,v,bought});
 if(bought)db.buys.push({id,pid:id,name:draft.name.trim(),qty:bought,cost:bought*buy});
 draft={name:'',colors:'',sizes:'',buy:'',sell:'',q:{}};save();closeNovo();go('estoque');toast('Produto salvo')}
render();grade();
new MutationObserver(()=>grade()).observe($('main'),{childList:true});
</script>
